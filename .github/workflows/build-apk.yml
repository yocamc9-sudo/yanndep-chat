name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: npx cap add android --packagemanager npm
      - run: npm install @capacitor/assets --save-dev
      - run: npx capacitor-assets generate --android --iconBackgroundSource IMG-20261109-WA0084.jpg --icon IMG-20261109-WA0084.jpg
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yanndep-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
